# Nasodren 5 API Worker'ı (Cloudflare Workers + Durable Objects).
# Deploy:   npm run worker:deploy   (wrangler deploy -c worker/wrangler.toml --env="")
# Yalnızca production ortamı vardır (preview kullanılmaz: veritabanı ortak Supabase projesidir).
# Secret'lar (değerleri repoya yazmayın):
#   npx wrangler secret put ADMIN_PASSWORD        -c worker/wrangler.toml --env=""
#   npx wrangler secret put SUPABASE_URL          -c worker/wrangler.toml --env=""
#   npx wrangler secret put SUPABASE_SERVICE_KEY  -c worker/wrangler.toml --env=""
# Ayrıntılar: docs/OPERASYON.md
#
# Hesap kimliği burada tutulmaz: CLOUDFLARE_ACCOUNT_ID ortam değişkeni ya da `wrangler login` kullanılır.

name = "nasodren5-api"
main = "src/index.mjs"
compatibility_date = "2025-09-01"
# Worker'ın herkese açık *.workers.dev adresi yoktur: yalnızca Pages (service binding) üzerinden çağrılır.
workers_dev = false
preview_urls = false

[observability]
enabled = true

[vars]
ORTAM = "production"
# Ek izinli origin'ler (virgülle). Pages aynı origin olduğu için normalde boş kalır. "*" kabul edilmez.
ALLOWED_ORIGINS = ""

[[durable_objects.bindings]]
name = "GAME_SESSION"
class_name = "GameSession"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameSession", "Room", "RateLimiter"]
