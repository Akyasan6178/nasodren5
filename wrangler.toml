# Cloudflare Pages projesi (frontend). API Worker'ının yapılandırması: worker/wrangler.toml
#   Build komutu:   npm run build        (her zaman sunucu modu; VITE_VERI_MODU ayarlamayın)
#   Çıktı dizini:   dist
#   Deploy:         npx wrangler pages deploy dist --project-name nasodren5 --branch main
#
# /api/* istekleri functions/api/[[path]].js tarafından service binding ile API Worker'ına iletilir:
# tarayıcı için aynı origin (CORS yok), Worker'ın herkese açık adresi yok.

name = "nasodren5"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"

# Production (main dalı) → API Worker'ı. Preview dağıtımı kullanılmaz (ortak veritabanı; bkz. docs/OPERASYON.md).
[[services]]
binding = "API"
service = "nasodren5-api"

# Preview (main dışındaki dallar): API bağlaması YOK. Yanlışlıkla bir preview dağıtımı oluşursa /api 503 döner
# ve ortak veritabanına hiçbir şey yazılamaz. Ayrıca panelden otomatik preview dağıtımlarını kapatın.
[env.preview.vars]
N5_PREVIEW = "api-kapali"
